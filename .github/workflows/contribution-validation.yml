name: Contribution full validation
on:
  push:
    branches: ["validation/full-20261005"]
permissions:
  contents: read
jobs:
  build-latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 344efa5ff9f200cea7cb613878b204c0978c9367
      - run: |
           docker build -f .github/docker/py.Dockerfile \
             --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
             --tag minigrid-docker .
      - name: Run tests
        run: docker run minigrid-docker pytest
      - name: Run doctest
        run: docker run minigrid-docker pytest --doctest-modules minigrid/

  build-old:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 344efa5ff9f200cea7cb613878b204c0978c9367
      - run: |
          docker build -f .github/docker/py-old.Dockerfile \
             --build-arg PYTHON_VERSION="3.10" \
             --tag minigrid-docker .
      - name: Run tests
        run: docker run minigrid-docker pytest

  contribution-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 344efa5ff9f200cea7cb613878b204c0978c9367
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pre-commit build
      - run: pre-commit run --all-files
      - run: python -m build
